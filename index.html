    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;

      --text-main: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-color: #38bdf8;

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {

      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;

    }

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .profile-header { text-align: center; margin-bottom: 32px; width: 100%; }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
      color: #ffffff;
      font-size: 32px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
      box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.3);
    }

    .name { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; }

    .profession {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent-color);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .bio { font-size: 0.9rem; color: var(--text-secondary); max-width: 90%; margin: 0 auto; }

    .links-container { width: 100%; display: flex; flex-direction: column; gap: 16px; }

    .link-button {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 100%;
      padding: 16px 24px;
      background-color: var(--card-bg);
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      transition: all 0.2s ease-in-out;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .link-button svg { position: absolute; left: 20px; width: 22px; height: 22px; fill: currentColor; }

    .link-button:hover {
      background-color: var(--card-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
      border-color: var(--accent-color);
    }

    .link-button:active { transform: translateY(0); }

    .link-button:focus-visible { outline: 3px solid var(--accent-color); outline-offset: 3px; }

    footer { margin-top: 40px; font-size: 0.8rem; color: var(--text-secondary); text-align: center; }

    @media (prefers-reduced-motion: reduce) {
      .link-button { transition: none; }
      .link-button:hover { transform: none; }
